<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ff91a4">
    <title>💕 Will You Be My Valentine? 💕</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hearts-bg"></div>
    
    <div class="container">
        <div class="character-container">
            <div class="character" id="character">
                <div class="face">
                    <div class="eyes">
                        <div class="eye left">
                            <div class="pupil"></div>
                        </div>
                        <div class="eye right">
                            <div class="pupil"></div>
                        </div>
                    </div>
                    <div class="cheeks">
                        <div class="cheek left"></div>
                        <div class="cheek right"></div>
                    </div>
                    <div class="mouth happy"></div>
                </div>
                <div class="heart-held">💕</div>
            </div>
        </div>
        
        <h1 class="title">Puchki, will you be my Valentine? 💝</h1>
        
        <div class="buttons-container">
            <button class="btn yes-btn" id="yesBtn">Yes! 💖</button>
            <button class="btn no-btn" id="noBtn">No 💔</button>
        </div>
    </div>

    <div class="celebration" id="celebration">
        <div class="celebration-content">
            <h1>Yaaay! 🎉💕</h1>
            <p>I knew you'd say yes, Puchki! 💖</p>
            <div class="big-heart">💝</div>
            <p class="love-text">You just made me the happiest! 🥰</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
